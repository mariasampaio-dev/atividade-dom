<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 2 - DOM</title>

</head>

<body>
 <h1>Atividade 2 - DOM</h1>
    <div id="pagina">

        <!-- CONTADOR -->
        <button id="btnIncrementar">Incrementar</button>
        <button id="btnDecrementar">Decrementar</button>

        <p id="contador">0</p>
        <br>

        <div class="espaco"></div>


        <!-- CAMPO DE TEXTO -->
        <input type="text" id="texto" placeholder="Digite algo...">

        <p id="caracteres">0 caracteres</p>
        <br>
        <br>
        <br>

        <div class="espaco-grande"></div>


        <!-- TEXTOS DIGITADOS -->
        <div id="textos"></div>

        <div class="espaco-grande"></div>


        <!-- LISTA -->
        <label for="tipoLista">Escolha o tipo de lista:</label>

        <select id="tipoLista">
            <option value="ul">Lista Não Ordenada</option>
            <option value="ol">Lista Ordenada</option>
        </select>

        <button id="btnAdicionarLista">Adicionar Lista</button>

        <div id="lista"></div>

        <br>

        <!-- RESETAR -->
        <button id="btnResetar">Resetar Tudo</button>

    </div>

    <script src="script.js"></script>

</body>
</html>
